services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=2k1FLu5d4RdM
      - POSTGRES_DB=postgres
    restart: always
    volumes:
        - ./odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    depends_on:
      - db
    expose:
      - "8069"
      - "8072"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - ./odoo-data:/var/lib/odoo
    restart: always
    secrets:
      - postgresql_password_catequeseplus

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    depends_on:
      - odoo

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "
        certbot certonly --webroot --webroot-path=/var/www/certbot --email your@email.com --agree-tos --no-eff-email -d yourdomain.com.br
      "
    depends_on:
      - nginx

  certbot-renew:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot renew --webroot --webroot-path=/var/www/certbot"

secrets:
  postgresql_password_catequeseplus:
    file: ./config/odoo_pg_pass
  postgresql_password_technochurch:
    file: ./config/odoo_pg_pass
